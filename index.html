<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FFFCF8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Oraklia — Conseiller d'achat IA</title>
    <meta name="description" content="Oraklia est un conseiller d'achat propulsé par l'IA : décrivez ce que vous cherchez, répondez à quelques questions et recevez les meilleurs produits avec leurs liens Amazon.fr." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oraklia.fr/" />

    <!-- Open Graph (partages Facebook, LinkedIn, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oraklia" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://oraklia.fr/" />
    <meta property="og:title" content="Oraklia — Conseiller d'achat IA" />
    <meta property="og:description" content="Décrivez ce que vous cherchez, répondez à quelques questions, et Oraklia recommande les meilleurs produits avec leurs liens Amazon.fr." />
    <meta property="og:image" content="https://oraklia.fr/og.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oraklia — Conseiller d'achat IA" />
    <meta name="twitter:description" content="Le conseiller d'achat IA qui recommande les meilleurs produits avec leurs liens Amazon.fr." />
    <meta name="twitter:image" content="https://oraklia.fr/og.png" />

    <!-- Structured data: helps Google associate the "Oraklia" brand with this site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Oraklia",
      "url": "https://oraklia.fr/",
      "logo": "https://oraklia.fr/favicon.svg",
      "description": "Conseiller d'achat propulsé par l'IA : recommandations de produits avec liens Amazon.fr.",
      "inLanguage": "fr-FR"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Oraklia",
      "url": "https://oraklia.fr/",
      "inLanguage": ["fr-FR", "en"],
      "description": "Conseiller d'achat IA. Décrivez ce que vous cherchez et recevez les meilleurs produits avec leurs liens Amazon.fr."
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #FFFCF8; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Fallback content for crawlers without JS execution (and a clear brand
         signal in the served HTML). Hidden once the React app mounts. -->
    <noscript>
      <main style="max-width:680px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#2a2018">
        <h1>Oraklia</h1>
        <p>Oraklia est un conseiller d'achat propulsé par l'intelligence artificielle.
           Décrivez ce que vous cherchez, répondez à quelques questions, et recevez
           les meilleurs produits avec leurs liens Amazon.fr.</p>
        <p>Activez JavaScript pour utiliser l'application.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
